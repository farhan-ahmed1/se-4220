# App Engine Standard config for the Flask photo gallery.
# Deploy with:  gcloud app deploy app.yaml
#
# NOTE: env_variables below contain DB credentials and Flask's session secret
# in plaintext. Anyone with Viewer access to the GCP project can read them.
# Acceptable for a class project; rotate / move to Secret Manager for anything
# longer-lived.

runtime: python312

# gunicorn is the production WSGI server App Engine Standard expects.
# -b :$PORT   -> bind to the port App Engine injects.
# main:app    -> import `app` from main.py.
# --workers 2 -> matches the F1 instance's single CPU; 2 keeps a spare for I/O waits.
entrypoint: gunicorn -b :$PORT --workers 2 --threads 4 --timeout 60 main:app

env_variables:
  DB_HOSTNAME: "136.116.60.71"
  DB_USERNAME: "root"
  DB_PASSWORD: "password4220"
  DB_NAME:     "photogallerydb"
  GCS_BUCKET:  "se4220-photogallery-bucket"
  GCP_KEY_FILE: "gcp-key.json"
  FLASK_SECRET_KEY: "photogallery-secret-key-4220"

# Serve /static/* directly from App Engine's edge (faster + doesn't wake a
# Python instance just for a CSS file). Everything else goes to Flask.
handlers:
  - url: /static
    static_dir: static
    secure: always

  - url: /.*
    script: auto
    secure: always

# Free-tier friendly: scale to zero when idle. First request after idle takes
# ~2-4s to warm up. Bump min_instances to 1 if you need snappy demos.
automatic_scaling:
  min_instances: 0
  max_instances: 2
  target_cpu_utilization: 0.65

# Opt into the warmup request so /_ah/warmup pre-loads the process before
# the first real user hits it.
inbound_services:
  - warmup
