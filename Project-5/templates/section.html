{% extends "base.html" %}
{% block title %}{{ section.name }} &mdash; Ames Classifieds{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('home') }}">Home</a></li>
    <li class="breadcrumb-item active">{{ section.name }}</li>
  </ol>
</nav>

<h1 class="mb-4">{{ section.name }}</h1>

<div class="row g-3">
  {% for c in categories %}
    <div class="col-md-6 col-lg-4">
      <a class="card h-100 text-decoration-none text-reset"
         href="{{ url_for('view_category', category_slug=c.slug) }}">
        <div class="card-body d-flex justify-content-between align-items-center">
          <span>{{ c.name }}</span>
          <span class="badge bg-secondary">{{ c.count }}</span>
        </div>
      </a>
    </div>
  {% endfor %}
</div>
{% endblock %}
