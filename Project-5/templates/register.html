{% extends "base.html" %}
{% block title %}Register &mdash; Ames Classifieds{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-4">Create an account</h1>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" name="username" minlength="3" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" minlength="6" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <input type="password" class="form-control" name="confirm" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
      <a href="{{ url_for('login') }}" class="btn btn-link">I already have an account</a>
    </form>
  </div>
</div>
{% endblock %}
